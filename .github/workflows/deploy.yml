name: "EFT: Plataforma Cursos en Linea - CI/CD"
run-name: "EFT Cursos en Linea | Etapa: ${{ vars.ETAPA || 'Pre Demo V01' }}"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── JOB 1: Build & Test de ambos servicios ───────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build cursos-service
        run: mvn -q -B -DskipTests package -f cursos-service/pom.xml
      - name: Build bff-service
        run: mvn -q -B -DskipTests package -f bff-service/pom.xml

  # ── JOB 2: Analisis de seguridad Trivy ───────────────────────
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Escaneo de vulnerabilidades y config (Trivy fs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig,secret'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '0'

  # ── JOB 2b: Analisis de dependencias con Snyk (recomendacion docente S8)
  #  Se activa cuando exista la variable RUN_SNYK=true y el secret SNYK_TOKEN.
  #  Reporta vulnerabilidades en las dependencias Maven de ambos servicios.
  # ─────────────────────────────────────────────────────────────
  snyk-scan:
    name: Snyk Security (dependencias)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ vars.RUN_SNYK == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@master
      - name: Snyk test - cursos-service
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=cursos-service/pom.xml --severity-threshold=high
      - name: Snyk test - bff-service
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=bff-service/pom.xml --severity-threshold=high

  # ── JOB 3: Build & Push de las 2 imagenes a Docker Hub ───────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      - name: Verificar secrets de Docker Hub
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Faltan DOCKERHUB_USERNAME o DOCKERHUB_TOKEN en los secrets."
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build & push cursos-service
        uses: docker/build-push-action@v5
        with:
          context: ./cursos-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cursos-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push bff-service
        uses: docker/build-push-action@v5
        with:
          context: ./bff-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bff-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan de la imagen cursos-service
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/cursos-service:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  # ── JOB 4: Deploy en EC2 (rabbitmq + cursos + bff + wallet) ───
  deploy-ec2:
    name: Deploy en EC2
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: ${{ vars.DEPLOY_EC2 == 'true' }}
    steps:
      - name: SSH al EC2 y desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            # Bootstrap docker/unzip si la instancia viene limpia
            if ! command -v docker >/dev/null 2>&1; then
              sudo yum install -y docker 2>/dev/null || sudo amazon-linux-extras install -y docker 2>/dev/null || (sudo apt-get update && sudo apt-get install -y docker.io)
              sudo systemctl enable --now docker 2>/dev/null || sudo service docker start || true
            fi
            command -v unzip >/dev/null 2>&1 || sudo yum install -y unzip 2>/dev/null || sudo apt-get install -y unzip

            sudo docker network create cursos-net || true

            # 1) RabbitMQ
            sudo docker rm -f rabbitmq-cursos || true
            sudo docker run -d --name rabbitmq-cursos --network cursos-net --restart unless-stopped \
              -p 5672:5672 -p 15672:15672 \
              -e RABBITMQ_DEFAULT_USER=guest -e RABBITMQ_DEFAULT_PASS=guest \
              rabbitmq:3.13-management

            # 2) Wallet de Oracle desde secret base64
            rm -rf ~/wallet && mkdir -p ~/wallet
            echo "${{ secrets.ORACLE_WALLET_B64 }}" | base64 -d > ~/wallet.zip
            unzip -o ~/wallet.zip -d ~/wallet

            # 3) cursos-service (core)
            sudo docker rm -f cursos-service || true
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cursos-service:latest
            sudo docker run -d --name cursos-service --network cursos-net --restart unless-stopped \
              -p 8081:8081 \
              -v ~/wallet:/app/wallet:ro \
              -e ORACLE_JDBC_URL="jdbc:oracle:thin:@${{ secrets.ORACLE_TNS_ALIAS }}?TNS_ADMIN=/app/wallet" \
              -e ORACLE_USER="${{ secrets.ORACLE_USER }}" \
              -e ORACLE_PASSWORD="${{ secrets.ORACLE_PASSWORD }}" \
              -e AZURE_ISSUER_URI="${{ secrets.AZURE_ISSUER_URI }}" \
              -e AZURE_JWKS_URI="${{ secrets.AZURE_JWKS_URI }}" \
              -e AZURE_AUDIENCE="${{ secrets.AZURE_AUDIENCE }}" \
              -e AWS_S3_BUCKET="${{ secrets.AWS_S3_BUCKET }}" \
              -e AWS_S3_REGION="us-east-1" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/cursos-service:latest

            # 4) bff-service (frontend + orquestacion de colas), publicado en el puerto 80
            sudo docker rm -f bff-service || true
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/bff-service:latest
            sudo docker run -d --name bff-service --network cursos-net --restart unless-stopped \
              -p 80:8080 \
              -e RABBITMQ_HOST="rabbitmq-cursos" \
              -e CURSOS_SERVICE_URL="http://cursos-service:8081" \
              -e AZURE_ISSUER_URI="${{ secrets.AZURE_ISSUER_URI }}" \
              -e AZURE_JWKS_URI="${{ secrets.AZURE_JWKS_URI }}" \
              -e AZURE_AUDIENCE="${{ secrets.AZURE_AUDIENCE }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/bff-service:latest

            sleep 25
            sudo docker ps | grep -E "rabbitmq-cursos|cursos-service|bff-service"
            echo "Despliegue EFT completado."
