# =============================================================
#  bff-service (Backend for Frontend) - CDY2204 EFT
# =============================================================
spring.application.name=bff-service
server.port=8080

# -------------------------------------------------------------
#  RabbitMQ (colas de inscripciones)
# -------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.virtual-host=/

app.rabbitmq.exchange=inscripciones.exchange
app.rabbitmq.queue=inscripciones.queue
app.rabbitmq.routingkey=inscripciones.routingkey
app.rabbitmq.dlx=inscripciones.dlx.exchange
app.rabbitmq.error-queue=inscripciones.error.queue
app.rabbitmq.error-routingkey=inscripciones.error.routingkey

# -------------------------------------------------------------
#  URL del cursos-service (core). En docker-compose: http://cursos-service:8081
# -------------------------------------------------------------
app.cursos-service.url=${CURSOS_SERVICE_URL:http://localhost:8081}

# -------------------------------------------------------------
#  Azure AD B2C (IDaaS)
# -------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/REEMPLAZAR/v2.0}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AZURE_JWKS_URI:https://REEMPLAZAR.b2clogin.com/REEMPLAZAR/discovery/v2.0/keys}
azure.b2c.audience=${AZURE_AUDIENCE:REEMPLAZAR_CLIENT_ID}
azure.b2c.role-claim=${AZURE_ROLE_CLAIM:extension_rol}

# Los mensajes rechazados van a la DLQ (cola de errores)
spring.rabbitmq.listener.simple.default-requeue-rejected=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Subida de material (proxy multipart hacia el cursos-service)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
